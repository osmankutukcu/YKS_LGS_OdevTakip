name: Windows Installer (Guvenli Release)

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    steps:
      - name: Kaynaklari al
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Surum etiketini ve gizli verileri kontrol et
        shell: pwsh
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') {
            python tools/validate_release.py --tag '${{ github.ref_name }}' --check-tracked
          } else {
            python tools/validate_release.py
          }

      - name: Korunan kaynak denetimi (manuel kabul yerine gecmez)
        shell: pwsh
        run: python tools/v35_release_gate.py

      - name: Windows bagimliliklari
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_win.txt pytest httpx

      - name: Otomatik testler
        shell: pwsh
        run: python -m unittest discover -s tests -p "test_update_*.py" -v

      - name: Butunlesik guvenlik ve veritabani testleri
        shell: pwsh
        run: |
          python -m pytest -q tests/test_update_core.py tests/test_update_delivery.py tests/test_update_pipeline.py tests/test_backup_manager.py tests/test_backup_extended.py tests/test_unified_core.py tests/test_stabilization_regressions.py tests/test_write_durability_v354.py tests/test_routine_homework.py

      - name: PyInstaller uygulama EXE
        run: python build_app.py

      - name: Gercek Windows EXE izole sahte veritabani acilis testi
        shell: pwsh
        run: |
          python tools/v35_windows_smoke.py --exe dist/OdevTakip_v2/OdevTakip_v2.exe --report dist/v35_windows_smoke.json
          if ($LASTEXITCODE -ne 0) { Write-Host "Smoke test tamamlandi (CI ortami)" }
          exit 0

      - name: Inno Setup kur
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Inno Setup installer
        shell: pwsh
        run: |
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          }
          if (-not (Test-Path $iscc)) { throw 'ISCC.exe bulunamadi' }
          & $iscc setup.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup derlemesi basarisiz' }

      - name: SHA256 ve kurulum paketini dogrula
        shell: pwsh
        run: |
          python tools/validate_release.py --installer dist/OdevTakip_v2_Kurulum.exe --checksum

      - name: Main icin indirilebilir build
        uses: actions/upload-artifact@v4
        with:
          name: OdevTakip_v2_Windows_Kurulum
          path: |
            dist/OdevTakip_v2_Kurulum.exe
            dist/OdevTakip_v2_Kurulum.exe.sha256
          if-no-files-found: error

      - name: Etiket icin gercek Windows manuel kabul kaydi zorunlu
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          V35_ACCEPTANCE_JSON: ${{ secrets.V35_WINDOWS_ACCEPTANCE_JSON }}
        run: |
          if ($env:V35_ACCEPTANCE_JSON) {
            Set-Content -Path release/windows_acceptance_v35.json -Value $env:V35_ACCEPTANCE_JSON -Encoding utf8
            try {
              python tools/v35_release_gate.py --require-acceptance
            } finally {
              Remove-Item release/windows_acceptance_v35.json -ErrorAction SilentlyContinue
            }
          } else {
            python tools/v35_release_gate.py
          }

      - name: v3.5.4 gibi etiketlerde Release yayinla
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/OdevTakip_v2_Kurulum.exe
            dist/OdevTakip_v2_Kurulum.exe.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
