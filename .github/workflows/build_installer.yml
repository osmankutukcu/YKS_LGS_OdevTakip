name: Windows Installer (Guvenli Release)

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    steps:
      - name: Kaynaklari al
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Surum etiketini ve gizli verileri kontrol et
        shell: pwsh
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') {
            python tools/validate_release.py --tag '${{ github.ref_name }}' --check-tracked
          } else {
            python tools/validate_release.py --check-tracked
          }

      - name: Tek kok ve rapor kaynak denetimi
        shell: pwsh
        run: |
          python tools/v3588_unified_preflight.py
          if ($LASTEXITCODE -ne 0) { throw 'V3.5.88 tam kaynak butunlugu engeli' }

      - name: V3.5.94 kontrollu ogrenci yonlendirmesi ve karar paneli testleri
        shell: pwsh
        run: |
          python -m pytest -q tests/test_report_center_recovery_v3594.py tests/test_report_navigation_v3594.py tests/test_teacher_decision_v3593.py tests/test_report_intervention_plan_v3592.py tests/test_report_academic_bridge_v3591.py tests/test_report_integrity_v3590.py tests/test_report_interpretation_v3589.py tests/test_integrated_report_v3584.py tests/test_v3535_canonical_evidence.py
          if ($LASTEXITCODE -ne 0) { throw 'Rapor veri kaynagi dogrulama testleri basarisiz' }

      - name: Korunan kaynak denetimi (manuel kabul yerine gecmez)
        shell: pwsh
        run: python tools/v35_release_gate.py

      - name: V3.5.27 korunan formlar ve yardimci davranislar kapisi
        shell: pwsh
        run: |
          python tools/v3527_core_guard.py
          if ($LASTEXITCODE -ne 0) { throw 'Korunan formlarda beklenmeyen degisiklik bulundu' }
          python -m unittest tests.test_v3527_protected_forms -v
          if ($LASTEXITCODE -ne 0) { throw 'Korunan formlar regresyon testleri gecemedi' }

      - name: V3.5.28 modül koordinasyonu regresyon ve kaynak denetimi
        shell: pwsh
        run: |
          python -m unittest tests.test_v3528_live_system -v
          if ($LASTEXITCODE -ne 0) { throw 'Canli sistem koordinasyon regresyon testleri gecemedi' }
          python tools/v3528_system_doctor.py | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Modul kaynak katalogu/korunan cekirdek denetimi gecemedi' }

      - name: V3.5.29 otomatik akademik takip ve denetim guvenlik testi
        shell: pwsh
        run: |
          python -m unittest tests.test_v3529_proactive_advisor -v
          if ($LASTEXITCODE -ne 0) { throw 'V3.5.29 otomatik takip testi basarisiz' }

      - name: V3.5.30 ortak akademik karar ve korunan cekirdek testleri
        shell: pwsh
        run: |
          python -m unittest tests.test_v3530_shared_academic -v
          if ($LASTEXITCODE -ne 0) { throw 'V3.5.30 akademik kanit uyumluluk testi basarisiz' }
          python tools/v3527_core_guard.py
          if ($LASTEXITCODE -ne 0) { throw 'Korunan cekirdek beklenmedik bicimde degisti' }

      - name: V3.5.40 butunlesik kaynak ve yayin preflight (release onayi degildir)
        shell: pwsh
        run: |
          python tools/v3540_preflight.py
          if ($LASTEXITCODE -ne 0) { throw 'V3.5.40 kaynak ve yayin preflight engeli' }

      - name: Windows bagimliliklari
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_win.txt pytest httpx

      - name: V3.5.94 gercek Qt karar paneli ve yonlendirme regresyonu (zorunlu)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "from PyQt6.QtWidgets import QApplication; print('Qt hazir')"
          if ($LASTEXITCODE -ne 0) { throw 'PyQt6 bulunamadi; karar paneli testi atlanamaz' }
          python -m pytest -q tests/test_report_center_recovery_v3594.py tests/test_teacher_decision_v3593.py tests/test_report_navigation_v3594.py
          if ($LASTEXITCODE -ne 0) { throw 'Ogretmen Karar Paneli Qt regresyonu basarisiz' }

      - name: V3.5.49 cevrimdisi mobil PDF ve alici guvenligi testleri
        shell: pwsh
        run: |
          python -m pip install "PyMuPDF>=1.24,<2"
          if ($LASTEXITCODE -ne 0) { throw 'PDF testi icin PyMuPDF kurulumu basarisiz' }
          python -m pytest -q tests/test_v3549_offline_mobile_center.py tests/test_v3545_smart_mobile_pdf.py tests/test_v3546_mobile_pdf_bridge.py
          if ($LASTEXITCODE -ne 0) { throw 'Mobil PDF ve alici guvenligi regresyon testleri basarisiz' }

      - name: V3.5.87 Rapor Merkezi kaynak regresyonu ve CI release denetimi
        shell: pwsh
        run: |
          python tools/v3587_ci_preflight.py
          if ($LASTEXITCODE -ne 0) { throw 'V3.5.87 PDF paketleme/CI kontrolu basarisiz' }
          python -m unittest tests.test_v3587_stabilization tests.test_bulk_report_v3586 tests.test_report_planner_bridge_v3585 tests.test_integrated_report_v3584 tests.test_professional_pdf_v3583 tests.test_report_center_v3581 tests.test_report_evidence_v3582 -q
          if ($LASTEXITCODE -ne 0) { throw 'V3.5.87 rapor regresyonu basarisiz' }

      - name: V3.5.51 ogretmen geri bildirim merkezi izole yetki testleri
        shell: pwsh
        run: |
          python -m unittest tests.test_v3550_mobile_feedback tests.test_v3551_teacher_feedback_center -v
          if ($LASTEXITCODE -ne 0) { throw 'V3.5.51 geri bildirim ve ogretmen yetki testleri basarisiz' }

      - name: V3.5.52 guvenli mobil WSGI koprusu ve erisim testleri
        shell: pwsh
        run: |
          python -m unittest tests.test_v3552_mobile_gateway -v
          if ($LASTEXITCODE -ne 0) { throw 'Guvenli mobil kopru fail-closed ve yetki testleri basarisiz' }

      - name: V3.5.53 mobil PDF otomatik kabul ve guvenlik testleri
        shell: pwsh
        run: |
          python -m unittest tests.test_v3553_mobile_acceptance -v
          if ($LASTEXITCODE -ne 0) { throw 'Mobil PDF çapraz-platform otomatik kabul başarısız' }
          python tools/v3553_mobile_acceptance.py --check-source
          if ($LASTEXITCODE -ne 0) { throw 'Mobil PDF çekirdek veya sürüm denetimi başarısız' }

      - name: V3.5.54 Mobil PDF kimlik ve baglanti denetimi
        shell: pwsh
        run: |
          python -m pytest -q tests/test_v3554_stabilization.py
          if ($LASTEXITCODE -ne 0) { throw 'Akilli Mobil PDF alici ve baglanti guvenligi testi basarisiz' }

      - name: V3.5.30-44 akademik danisman, cep ajandasi ve butunlesik regresyon
        shell: pwsh
        run: |
          python -m unittest tests.test_v3530_shared_academic tests.test_v3531_system_health tests.test_v3532_verified_recovery tests.test_v3533_backup_automation tests.test_v3534_cohort_advisor tests.test_v3535_canonical_evidence tests.test_v3536_academic_actions tests.test_v3537_intervention_advisor tests.test_v3538_intervention_followup tests.test_v3539_intervention_patterns tests.test_v3540_release_safety tests.test_v3541_mobile_agenda_pdf tests.test_v3542_agenda_navigation tests.test_v3543_agenda_whatsapp_long_messages tests.test_v3544_student_directory -q
          if ($LASTEXITCODE -ne 0) { throw 'Akademik danisman/cep ajandasi/butunlesik testler gecemedi' }

      - name: Otomatik testler
        shell: pwsh
        run: python -m unittest discover -s tests -p "test_update_*.py" -v

      - name: Butunlesik guvenlik ve veritabani testleri
        shell: pwsh
        run: |
          python -m pytest -q tests/test_update_core.py tests/test_update_delivery.py tests/test_update_pipeline.py tests/test_backup_manager.py tests/test_backup_extended.py tests/test_unified_core.py tests/test_stabilization_regressions.py tests/test_write_durability_v354.py tests/test_routine_homework.py

      - name: PyInstaller uygulama EXE
        run: python build_app.py

      - name: Gercek Windows EXE izole sahte veritabani acilis testi
        shell: pwsh
        run: |
          python tools/v35_windows_smoke.py --exe dist/OdevTakip_v2/OdevTakip_v2.exe --report dist/v35_windows_smoke.json
          if ($LASTEXITCODE -ne 0) { throw "Windows EXE acilis testi basarisiz; kurulum yayinlanamaz" }

      - name: Inno Setup kur
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Inno Setup installer
        shell: pwsh
        run: |
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          }
          if (-not (Test-Path $iscc)) { throw 'ISCC.exe bulunamadi' }
          & $iscc setup.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup derlemesi basarisiz' }

      - name: SignPath Vakfi ile dijital kod imzalama (Acik Kaynak Resmi Imza)
        if: env.SIGNPATH_API_TOKEN != ''
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          org-id: '${{ secrets.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: '${{ secrets.SIGNPATH_PROJECT_SLUG || ''yks-lgs-homeworkmanager'' }}'
          signing-policy-slug: '${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG || ''release-signing'' }}'
          github-token: '${{ secrets.GITHUB_TOKEN }}'
          wait-for-completion: true
          output-artifact-directory: 'dist_signed'
          file-path: 'dist/OdevTakip_v2_Kurulum.exe'

      - name: Imzali kurulum paketini yerine koy
        if: env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          if (Test-Path dist_signed/OdevTakip_v2_Kurulum.exe) {
            Copy-Item dist_signed/OdevTakip_v2_Kurulum.exe dist/OdevTakip_v2_Kurulum.exe -Force
            Write-Host "Kurulum paketi SignPath ile basariyla dijital olarak imzalandi."
          }

      - name: SHA256 ve kurulum paketini dogrula
        shell: pwsh
        run: |
          python tools/validate_release.py --installer dist/OdevTakip_v2_Kurulum.exe --checksum

      - name: Main icin indirilebilir build
        uses: actions/upload-artifact@v4
        with:
          name: OdevTakip_v2_Windows_Kurulum
          path: |
            dist/OdevTakip_v2_Kurulum.exe
            dist/OdevTakip_v2_Kurulum.exe.sha256
          if-no-files-found: error

      - name: Etiket icin gercek Windows manuel kabul kaydi zorunlu
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          V35_ACCEPTANCE_JSON: ${{ secrets.V35_WINDOWS_ACCEPTANCE_JSON }}
        run: |
          if ($env:V35_ACCEPTANCE_JSON) {
            Set-Content -Path release/windows_acceptance_v35.json -Value $env:V35_ACCEPTANCE_JSON -Encoding utf8
            try {
              python tools/v35_release_gate.py --require-acceptance
              if ($LASTEXITCODE -ne 0) { throw 'Windows manuel kabul onayı doğrulanamadı; Release engellendi' }
            } finally {
              Remove-Item release/windows_acceptance_v35.json -ErrorAction SilentlyContinue
            }
          } else {
            throw 'Gercek Windows manuel kabul kaydi bulunmuyor; etiketli Release engellendi'
          }

      - name: Etiket icin Mac ve mobil cihaz kabul kaydi zorunlu
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          MOBILE_DEVICE_ACCEPTANCE_JSON: ${{ secrets.V3553_MOBILE_DEVICE_ACCEPTANCE_JSON }}
        run: |
          if ($env:MOBILE_DEVICE_ACCEPTANCE_JSON) {
            Set-Content -Path release/mobile_pdf_device_acceptance.json -Value $env:MOBILE_DEVICE_ACCEPTANCE_JSON -Encoding utf8
            try {
              python tools/v3553_mobile_acceptance.py --require-device-acceptance
              if ($LASTEXITCODE -ne 0) { throw 'Mobil PDF manuel cihaz kabulü geçmedi; Release engellendi' }
            } finally {
              Remove-Item release/mobile_pdf_device_acceptance.json -ErrorAction SilentlyContinue
            }
          } else {
            throw 'Mac/mobil manuel cihaz kabul kaydi yok; etiketli Release engellendi'
          }

      - name: v3.5.4 gibi etiketlerde Release yayinla
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/OdevTakip_v2_Kurulum.exe
            dist/OdevTakip_v2_Kurulum.exe.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
